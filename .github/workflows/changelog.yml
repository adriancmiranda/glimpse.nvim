name: 📜 Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: release-write-${{ github.ref }}

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync with remote branch
        run: |
          git fetch origin ${{ github.ref_name }}
          git switch -C ${{ github.ref_name }} origin/${{ github.ref_name }}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: -o CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Link pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: sh .github/scripts/link-changelog-prs.sh CHANGELOG.md

      - name: Lint changelog
        run: make lint-changelog

      - name: Commit changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: update CHANGELOG.md"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Push succeeded on attempt ${attempt}/3"
              exit 0
            fi

            echo "Push failed on attempt ${attempt}/3, resyncing with origin/${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git switch -C ${{ github.ref_name }} origin/${{ github.ref_name }}

            echo "Regenerating changelog after sync"
            git cliff --config cliff.toml -o CHANGELOG.md
            sh .github/scripts/link-changelog-prs.sh CHANGELOG.md
            make lint-changelog
            git add CHANGELOG.md
            git diff --cached --quiet || git commit -m "docs: update CHANGELOG.md"
          done

          git push origin HEAD:${{ github.ref_name }}
