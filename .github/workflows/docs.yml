name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'lua/**/*.lua'

concurrency:
  group: release-write-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install lemmy-help
        run: |
          curl -fsSL https://github.com/numToStr/lemmy-help/releases/latest/download/lemmy-help-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/lemmy-help
      - name: Generate vimdoc
        run: |
          mkdir -p doc
          lemmy-help lua/glimpse/init.lua lua/glimpse/detect.lua lua/glimpse/util.lua > doc/glimpse.txt
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doc/
          git diff --cached --quiet || git commit -m "docs: auto-generate vimdoc"
          git push
